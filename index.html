<html lang="en" class="dark">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23030407'/%3E%3Crect x='3' y='3' width='10' height='10' fill='none' stroke='%2300ff41' stroke-width='2'/%3E%3C/svg%3E" />

  </head>
  <body style="background:#030704">
    <div id="root"></div>
    <script>
      /* boot claim: start the single-use token claim the instant this HTML
         parses — before the JS bundle finishes downloading — so the booth
         QR rotates as fast as physically possible after a scan.
         The result is handed to the React app via window.__acscClaim so the
         claim fires EXACTLY once (a duplicate would be rejected by the
         server as "already in use"). */
      ;(function () {
        try {
          var t = new URLSearchParams(window.location.search).get('t')
          if (!t) return
          window.__acscClaim = fetch('https://acsc-cyber-quiz-api.rayhangeno.workers.dev/session/start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: t }),
          })
            .then(function (r) {
              return r.ok
            })
            .catch(function () {
              return false
            })
        } catch (e) {
          window.__acscClaim = Promise.resolve(false)
        }
      })()
    </script>
  </body>
</html>
